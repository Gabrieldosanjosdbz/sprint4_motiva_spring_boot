# Perfil "local": sobe a API num H2 em memória (modo Oracle) rodando os próprios
# scripts da Sprint 3. Serve para testar sem VPN/credenciais da FIAP.
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:motiva;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:sql/script-criacao.sql
spring.sql.init.data-locations=file:sql/script-dados.sql

spring.jpa.show-sql=false
