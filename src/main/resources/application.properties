spring.application.name=motiva

# Oracle da FIAP - as mesmas tabelas e sequences da Sprint 3 (sql/script-criacao.sql)
# Credenciais vêm de variáveis de ambiente; os valores depois do ":" são só placeholders.
spring.datasource.url=${MOTIVA_DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${MOTIVA_DB_USUARIO:SEU_RM}
spring.datasource.password=${MOTIVA_DB_SENHA:SUA_SENHA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas já existem: o Hibernate não cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Sao_Paulo
